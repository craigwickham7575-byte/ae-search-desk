name: Refresh AE vacancies
on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch vacancies
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/refresh_jobs.py
      - name: Commit updated feed
        run: |
          git config user.name "AE Vacancy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update weekday AE vacancy feed"
            git push
          fi
